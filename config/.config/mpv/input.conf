# Vim-like Navigation Keybindings for MPV

# Seeking (h/l = 5s seek, H/L = 60s seek)
h seek -5
l seek 5
H seek -60
L seek 60
LEFT seek -5
RIGHT seek 5
UP seek 60
DOWN seek -60

# Volume Control (j = decrease volume, k = increase volume)
j add volume -5
k add volume 5
J add volume -10
K add volume 10
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5

# Playback Control
SPACE cycle pause
p cycle pause
q quit
Q quit-watch-later

# Fullscreen & Mute
f cycle fullscreen
m cycle mute

# Speed Control ([ = decrease speed, ] = increase speed, BS = reset)
[ multiply speed 1/1.1
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
BS set speed 1.0

# Subtitle & Audio Track Navigation
v cycle audio
V cycle sub
s cycle sub-visibility

# Chapter Navigation (Ctrl+n = next chapter, Ctrl+p = prev chapter)
Ctrl+n add chapter 1
Ctrl+p add chapter -1

# Frame Stepping
. frame-step
, frame-back-step
