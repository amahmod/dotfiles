# ====================================================================
#  Starship Prompt Configuration - Catppuccin Macchiato
# ====================================================================

palette = "catppuccin_macchiato"

format = """
$os\
$directory\
$git_branch\
$git_status\
$rust\
$golang\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold lavender"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
style = "bold mauve"
format = "on [$symbol$branch]($style) "
symbol = " "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
style = "bold yellow"
format = "took [$duration]($style) "
min_time = 2_000

# Vi Mode Indicators
[character]
success_symbol = "[λ](bold blue) "
error_symbol = "[λ](bold red) "
vimcmd_symbol = "[NORMAL](bold green) "
vimcmd_replace_one_symbol = "[REPLACE](bold maroon) "
vimcmd_replace_symbol = "[REPLACE](bold maroon) "
vimcmd_visual_symbol = "[VISUAL](bold yellow) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold peach"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold sapphire"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

