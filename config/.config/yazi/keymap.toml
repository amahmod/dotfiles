[mgr]
prepend_keymap = [
    { on = [ "<C-s>" ], run = 'shell "$SHELL" --block --confirm', desc = "Open shell in current directory" },
    { on = [ "<C-e>" ], run = 'shell "thunar ." --orphan --confirm', desc = "Open Thunar in current directory" },
    { on = [ "<C-t>" ], run = 'shell "thunar ." --orphan --confirm', desc = "Open Thunar in current directory" },
    { on = [ "g", "t" ], run = 'shell "thunar ." --orphan --confirm', desc = "Open Thunar in current directory" },
    { on = [ "w" ], run = "shell 'bash ~/.config/hypr/scripts/set-wallpaper.sh \"%h\"' --confirm", desc = "Set selected image as wallpaper" },

    # Mobile Phone Transfers & Navigation
    { on = [ "g", "p" ], run = [ 'shell "phone-mount --quiet" --confirm', 'cd ~/Phone' ], desc = "Mount & go to Phone (~/Phone)" },
    { on = [ "m", "p" ], run = 'shell "phone-transfer push \"$@\"" --confirm', desc = "Fast push selected file(s) to phone (ADB)" },
    { on = [ "m", "c" ], run = 'shell "phone-transfer pull photos ." --confirm', desc = "Pull phone photos into current dir" },
    { on = [ "m", "d" ], run = 'shell "phone-transfer pull downloads ." --confirm', desc = "Pull phone downloads into current dir" },
    { on = [ "m", "m" ], run = 'shell "phone-mount mount" --confirm', desc = "Mount phone to ~/Phone" },
    { on = [ "m", "u" ], run = 'shell "phone-mount unmount" --confirm', desc = "Unmount ~/Phone" },
    { on = [ "m", "s" ], run = 'shell "phone-transfer" --confirm', desc = "Open phone transfer menu" },
]
