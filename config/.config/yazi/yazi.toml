[mgr]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
cache_dir = ""
image_filter = "lanczos3"
image_quality = 85
sixel_fraction = 15

[opener]
edit = [
    { run = '${EDITOR:-nvim} %s', block = true, desc = "Editor" },
]
play = [
    { run = 'mpv %s', block = true, desc = "Play with mpv" },
]
open = [
    { run = 'xdg-open %s', desc = "Open with default application" },
]

[open]
prepend_rules = [
    { mime = "video/*", use = [ "play", "open" ] },
    { mime = "audio/*", use = [ "play", "open" ] },
    { url = "*.mp4", use = [ "play", "open" ] },
    { url = "*.mkv", use = [ "play", "open" ] },
    { url = "*.webm", use = [ "play", "open" ] },
    { url = "*.avi", use = [ "play", "open" ] },
    { url = "*.mov", use = [ "play", "open" ] },
    { url = "*.mp3", use = [ "play", "open" ] },
    { url = "*.flac", use = [ "play", "open" ] },
    { url = "*.wav", use = [ "play", "open" ] },
]
