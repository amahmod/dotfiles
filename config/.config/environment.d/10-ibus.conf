# Systemd user session environment for IBus & Avro Phonetic on Wayland
# Note: GTK_IM_MODULE and QT_IM_MODULE are intentionally unset on Wayland so
# applications natively use Wayland text-input-v3 via ibus-ui-gtk3 --enable-wayland-im.
XMODIFIERS=@im=ibus
INPUT_METHOD=ibus
SDL_IM_MODULE=ibus
GLFW_IM_MODULE=ibus
